name: Protobuf routing
on:
  push:
    paths: ['protobuf_*.py', 'ws.py', 'types_api.py', 'main.py', 'requirements-protobuf.txt', 'scripts/*protobuf*', 'scripts/install_zenoh.py', 'test/**', '.github/workflows/protobuf.yml']
  pull_request:
    paths: ['protobuf_*.py', 'ws.py', 'types_api.py', 'main.py', 'requirements-protobuf.txt', 'scripts/*protobuf*', 'scripts/install_zenoh.py', 'test/**', '.github/workflows/protobuf.yml']
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-protobuf.txt
      - run: python -m unittest discover -s test -q
